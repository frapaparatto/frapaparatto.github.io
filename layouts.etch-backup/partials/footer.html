{{ if eq (.Site.Params.dark | default "auto") "auto" -}}
<script>
(function() {
    var btn = document.getElementById("theme-toggle");
    if (!btn) return;
    var sunIcon = btn.querySelector(".icon-sun");
    var moonIcon = btn.querySelector(".icon-moon");

    function current() {
        var explicit = document.documentElement.getAttribute("data-theme");
        if (explicit === "light" || explicit === "dark") return explicit;
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    function render(theme) {
        // SVG elements don't reflect the `.hidden` IDL property onto the
        // attribute like HTML elements do, so the attribute is toggled directly.
        sunIcon.toggleAttribute("hidden", theme !== "dark");
        moonIcon.toggleAttribute("hidden", theme === "dark");
        btn.setAttribute("aria-label", theme === "dark" ? "Switch to light theme" : "Switch to dark theme");
    }

    render(current());

    btn.addEventListener("click", function() {
        var next = current() === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
        render(next);
    });
})();
</script>
{{ end -}}
