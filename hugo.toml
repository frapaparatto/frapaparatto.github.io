baseURL = "https://frapaparatto.dev"
title = "fra@dev:~#"
theme = "maverick"
languageCode = "en-US"
enableInlineShortcodes = true
pygmentsCodeFences = true
pygmentsUseClasses = true

[author]
  name = "Francesco Paparatto"

[params]
  description = "Personal blog about software, tech and things I find interesting."
  dark = "auto"
  highlight = true
  mainSections = ["posts"]
  logo = "/assets/favicon.ico"
  author = "Francesco Paparatto"
  items = 10

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "about"
    name = "about"
    url = "/about/"
    weight = 20
  [[menu.main]]
    identifier = "til"
    name = "til"
    url = "/til/"
    weight = 30
  [[menu.main]]
    identifier = "log"
    name = "log"
    url = "/log/"
    weight = 40
  [[menu.main]]
    identifier = "projects"
    name = "projects"
    url = "/projects/"
    weight = 50
  [[menu.main]]
    identifier = "cheatsheets"
    name = "cheatsheets"
    url = "/cheatsheets/"
    weight = 60

[permalinks]
  posts = "/:title/"
  pages = "/:slug/"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
  style = "rose-pine-dawn"

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML"]
